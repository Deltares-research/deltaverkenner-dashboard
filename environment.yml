name: deltaverkenner-dashboard

channels:
  - conda-forge

dependencies:
  # Python version
  - python >=3.11

  # Conda dependencies (from [tool.pixi.dependencies])
  - pandas >=3.0.2,<4
  - openpyxl >=3.1.5,<4
  - ipykernel >=7.2.0,<8
  - pip >=26.0.1,<27
  - matplotlib >=3.10.8,<4
  - geopandas >=1.1.3,<2
  - tqdm >=4.67.3,<5

  # These are NOT on conda-forge (or not reliably), so install via pip
  - pip:
      - cmocean >=4.0.3,<5
      - highlight_text >=0.2,<0.3
      - zipfile2 >=0.0.12,<0.0.13

      # Local editable install (equivalent to pixi editable = true)
      - -e .