[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{name = "jreusen", email = "25225054+JesseReusen@users.noreply.github.com"}]
dependencies = []
name = "deltaverkenner-dashboard"
requires-python = ">= 3.11"
version = "0.1.0"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
deltaverkenner_dashboard = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
pandas = ">=3.0.2,<4"
openpyxl = ">=3.1.5,<4"
ipykernel = ">=7.2.0,<8"
pip = ">=26.0.1,<27"
matplotlib = ">=3.10.8,<4"
